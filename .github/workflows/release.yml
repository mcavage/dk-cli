name: release

# Auto-publish on version bump: bump VERSION, merge to main, and the tag,
# build, release and formula update all happen without a manual tag push.
#
# The guard is that the tag must not already exist. That makes the whole job
# idempotent, so an unrelated push to main is a no-op rather than a failed or
# duplicate release.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.1.1)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The secrets context is not available in step-level `if:` conditions, so
    # the token is mapped to job-level env and the steps branch on that. Getting
    # this wrong fails the whole workflow file to parse, not just the step.
    env:
      TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
    steps:
      # Actions are pinned by SHA, matching the sibling pix repo: a mutable tag
      # like @v4 is a supply-chain hole in a job that holds a push token.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # git describe and tag checks need history

      - name: resolve version
        id: v
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="$(tr -d ' \n' < VERSION)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION must be semver, got '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists, nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.v.outputs.exists == 'false'
        with:
          go-version: '1.26'

      # Never publish a build that would not pass CI. A release is the one
      # moment where skipping the gate is most tempting and most expensive.
      - name: gate
        if: steps.v.outputs.exists == 'false'
        run: make check

      - name: build
        if: steps.v.outputs.exists == 'false'
        run: make dist VERSION=${{ steps.v.outputs.tag }}

      - name: tag
        if: steps.v.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.tag }}" -m "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: publish
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes \
            dist/dk_* dist/checksums.txt

      # Cross-repo push needs a PAT: the built-in GITHUB_TOKEN is scoped to this
      # repository only. Without the secret this step is skipped rather than
      # failing the release, so a missing tap never blocks shipping the binaries.
      # Checked out with a token rather than cloned with one embedded in the
      # remote URL, so the credential never persists in the runner's git config.
      - name: check out the tap
        if: steps.v.outputs.exists == 'false' && env.TAP_TOKEN != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: mcavage/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap

      - name: update homebrew tap
        if: steps.v.outputs.exists == 'false' && env.TAP_TOKEN != ''
        env:
          TAP_REPO: mcavage/homebrew-tap
          TAP_DIR: tap
          REPO: ${{ github.repository }}
        run: ./scripts/update-tap.sh "${{ steps.v.outputs.tag }}"

      - name: tap not updated
        if: steps.v.outputs.exists == 'false' && env.TAP_TOKEN == ''
        run: |
          echo "::notice::Binaries published, Homebrew formula NOT updated."
          echo "::notice::Add a TAP_PUSH_TOKEN secret (the same PAT mcavage/pix uses)"
          echo "::notice::to automate it, or run:"
          echo "::notice::  make dist && TAP_TOKEN=\$TOKEN ./scripts/update-tap.sh ${{ steps.v.outputs.tag }}"
