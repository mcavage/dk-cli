name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
      # gofmt, vet and the full suite. No credentials: every test runs offline,
      # since the one live dependency (the handoff endpoint) is exercised
      # through httptest rather than the network.
      - run: make check
